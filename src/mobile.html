<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#191921"><link rel="manifest" href="/mobile.webmanifest"><link rel="stylesheet" href="/mobile.css"><title>Orbit Remote</title></head><body><main class="remote-app">
<header class="topbar"><button id="menu-toggle" class="icon-button" aria-label="메뉴">☰</button><div class="session-heading"><strong id="output-title">현재 세션</strong><span id="session-profile">세션 정보 확인 중</span></div><span id="state" class="connection-pill">연결 확인 중</span></header>
<div id="menu-panel" class="menu-panel" hidden><a class="brand" href="/mobile.html"><img src="/orbit.svg" alt=""><b>orbit</b></a><div class="menu-actions"><select id="theme" class="theme-select" aria-label="테마"><option value="system">시스템</option><option value="dark">어둡게</option><option value="light">밝게</option></select><button id="refresh" class="secondary">다시 연결</button><button id="logout" class="secondary">연결 일시 중단</button></div><div id="project-row" class="project-row" hidden><span class="project-label">프로젝트</span><select id="project-select" aria-label="프로젝트 선택"></select></div><details id="saved-sessions" class="session-drawer"><summary><span>이전 대화</span><span class="summary-note">저장된 Codex·Claude 대화</span></summary><div class="session-drawer-body"><div class="saved-tools"><input id="saved-filter" placeholder="이전 대화 제목 또는 폴더 검색"></div><div id="saved-list" class="saved-list"><p>이전에 열었던 대화를 불러옵니다.</p></div></div></details><div class="session-row"><div id="session-tabs" class="session-tabs"></div><select id="session-select" aria-label="세션 선택"></select><details id="new-session" class="new-session"><summary aria-label="새 세션">＋</summary><div><button class="primary" data-create="codex">Codex</button><button class="primary" data-create="claude">Claude</button><button data-create="powershell">PowerShell</button><button data-create="cmd">명령 프롬프트</button></div></details></div></div>
<div id="install-banner" class="install-banner" hidden><span id="install-text"></span><div class="install-actions"><button id="install-action" class="secondary" hidden>설치</button><button id="install-dismiss" class="secondary">닫기</button></div></div>
<section id="boot" class="pair-card"><span class="eyebrow">REMOTE WORKSPACE</span><h1>연결 확인 중</h1><p>이 브라우저의 로그인 상태를 확인하고 있습니다.</p></section><section id="reconnect" class="pair-card" hidden><span class="eyebrow">REMOTE WORKSPACE</span><h1>연결이 일시 중단되었습니다</h1><p>로그인은 유지됩니다. 다시 연결하면 그대로 이어집니다.</p><button id="resume" class="primary">다시 연결</button></section><section id="login" class="pair-card" hidden><span class="eyebrow">ORBIT</span><h1>로그인</h1><form id="login-form"><input id="login-email" type="email" placeholder="이메일" autocomplete="username" required><input id="login-password" type="password" placeholder="비밀번호" autocomplete="current-password" required><p id="login-error" class="login-error" hidden></p><button id="login-submit" class="primary" type="submit">로그인</button></form></section>
<section id="workspace" hidden><div id="empty" class="empty-state" hidden><p>실행 중인 세션이 없습니다.</p><div class="create-row"><button class="primary" data-create="codex">Codex</button><button class="primary" data-create="claude">Claude</button><button data-create="powershell">PowerShell</button><button data-create="cmd">명령 프롬프트</button></div></div><section class="conversation-card" aria-label="세션 대화"><div class="conversation-meta"><span id="conversation-status" class="status-dot">연결 중</span><button id="view-toggle" class="secondary">원본 터미널</button></div><div id="readable-output" class="readable-output" aria-live="polite"></div><div id="raw-output" hidden></div><button id="latest" class="latest" hidden>최신 출력</button></section><footer class="composer-wrap"><div id="composer-status" class="composer-status">입력 준비 중</div><div class="command-row"><textarea id="input" rows="2" maxlength="8192" placeholder="명령 또는 응답 입력" aria-label="명령 또는 응답 입력"></textarea><div class="command-actions"><button id="input-only" class="secondary">입력만</button><button id="stop" class="secondary">중단</button><button id="send" class="primary">보내기</button></div></div><div class="enter-row"><button data-key="enter" class="secondary">Enter</button><span>Enter는 터미널에 전송 · Ctrl/⌘ Enter는 작성 내용 전송</span></div><details class="keybar"><summary>다른 특수 키</summary><div><button data-key="ctrl-c">Ctrl C</button><button data-key="tab">Tab</button><button data-key="escape">Esc</button><button data-key="up">↑</button><button data-key="down">↓</button><button data-key="left">←</button><button data-key="right">→</button></div></details></footer></section></main><div id="toast" role="status" hidden></div><script type="module" src="/mobile.js"></script></body></html>
