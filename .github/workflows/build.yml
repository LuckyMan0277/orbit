name: build

on:
  push:
    branches: [main, codex/terminal-first]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        shell: pwsh
        run: npm.cmd ci --no-audit --no-fund

      - name: Test frontend
        shell: pwsh
        run: |
          npm.cmd test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }

      - name: Stamp the release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3, got $version" }
          $file = 'native/AssemblyInfo.cs'
          $text = Get-Content -Raw $file
          $text = $text -replace '(AssemblyVersion|AssemblyFileVersion)\("[\d.]+"\)', ('$1("' + $version + '.0")')
          Set-Content -NoNewline -Path $file -Value $text
          "APP_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build Orbit
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup is not available' }

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:APP_VERSION) { $env:APP_VERSION } else { '0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer/orbit.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Setup
          path: release/Orbit-Setup.exe

      - name: Publish terminal preview prerelease
        if: github.ref == 'refs/heads/codex/terminal-first'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'terminal-preview-${{ github.sha }}'
          gh release create $tag release/Orbit-Setup.exe --target '${{ github.sha }}' --prerelease --latest=false --title 'Orbit terminal preview' --notes '실험용 단일 터미널 빌드입니다. 실제 Windows GUI 검증은 아직 수행하지 않았습니다. Experimental single-terminal build; native Windows GUI testing has not been performed.'

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' release/Orbit-Setup.exe --title 'Orbit ${{ github.ref_name }}' --generate-notes
